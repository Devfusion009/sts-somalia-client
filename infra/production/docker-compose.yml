# Production stack for the Mogadishu server. Deployed by
# .github/workflows/deploy-production.yml, which pins WEB_IMAGE and API_IMAGE
# to the git SHA of the release. Only Caddy publishes ports.
name: sts

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./${CADDYFILE:-Caddyfile.ip}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 128m, cpus: "0.25" }

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Heap cap at about 75% of the container limit so V8 collects before the OOM killer acts.
      NODE_OPTIONS: --max-old-space-size=960
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    expose: ["3000"]
    networks: [edge, backend]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 1280m, cpus: "1.0" }

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      NODE_OPTIONS: --max-old-space-size=576
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    expose: ["4000"]
    networks: [edge, backend]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 768m, cpus: "0.75" }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { memory: 320m, cpus: "0.25" }

networks:
  edge: {}
  # No route to the internet or the host: Redis is reachable only by web and api.
  backend:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
