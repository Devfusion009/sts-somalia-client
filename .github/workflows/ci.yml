name: CI

# Required check on every pull request into main (QA) and production.
# Deploy workflows do not run these checks; a merge only ships what passed here.

on:
  pull_request:
    branches: [main, production]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w api

      - name: Build
        run: npm run build -w api

      - name: Shared types and Umrah integration tests
        run: |
          npm test -w @sts/shared-types
          python3 apps/api/test/public-umrah-integration.py --request-pool
          python3 apps/api/test/marketing-aging-integration.py
          python3 apps/api/test/umrah-capacity-integration.py
          python3 apps/api/test/my-bookings-page-integration.py

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # apps/web imports the API's compiled declarations (api/dist/trpc/router).
      - name: Build api types
        run: npm run build -w api

      - name: Lint
        run: npm run lint -w web

      - name: Type check
        run: npx tsc --noEmit -p apps/web

      - name: Umrah UI and notification tests
        run: node --test apps/web/test/agent-bookings.test.cjs apps/web/test/catalog-outage.test.cjs apps/web/test/cron-auth.test.cjs apps/web/test/external-worker.test.mjs apps/web/test/marketing-callback.test.cjs apps/web/test/my-bookings-pages.test.cjs apps/web/test/pool-email.test.cjs apps/web/test/pool-worker.test.cjs apps/web/test/public-umrah-catalog.test.cjs
