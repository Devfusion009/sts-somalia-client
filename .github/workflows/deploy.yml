name: Deploy to AWS

# Neither app builds on its box. apps/api used to build in place on EC2,
# which only stayed cheap because the box kept tsc's incremental state; a
# full type-check of the umrah/events modules needs ~0.9GB and hung the box
# until SSH dropped (run 39952309723). apps/web never could: a full
# `next build` OOM'd the Lightsail box's 913MB RAM even with swap and a
# raised V8 heap limit, and a raised-heap retry swap-thrashed it badly
# enough to need a reboot. So apps/web builds here on the runner (7GB RAM)
# and only the compiled `.next/standalone` output + static assets ship to
# the box — the same fix that got it running manually.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One QA deploy at a time; a newer merge replaces a queued older one.
concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build -w api

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync source
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .git --exclude .next --exclude dist \
            --exclude .vercel --exclude '*.tsbuildinfo' --exclude '.env.local' \
            -e "ssh -i ~/.ssh/ec2.pem" \
            ./ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/app/

      - name: Write env file
        run: |
          ssh -i ~/.ssh/ec2.pem ubuntu@${{ secrets.EC2_HOST }} "cat > /home/ubuntu/app/apps/api/.env.local" <<EOF
          PORT=4000
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          WEB_ORIGIN=${{ secrets.WEB_ORIGIN }}
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          EMAIL_PROVIDER=${{ vars.EMAIL_PROVIDER }}
          EMAIL_FROM=${{ vars.EMAIL_FROM }}
          EMAIL_REPLY_TO=${{ vars.EMAIL_REPLY_TO }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          INTEGRATIONS_ENCRYPTION_KEY=${{ secrets.INTEGRATIONS_ENCRYPTION_KEY }}
          EOF

      - name: Ship build artifacts
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/ec2.pem" \
            packages/shared-types/dist/ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/app/packages/shared-types/dist/
          rsync -az --delete -e "ssh -i ~/.ssh/ec2.pem" \
            apps/api/dist/ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/app/apps/api/dist/

      - name: Install, restart
        run: |
          ssh -i ~/.ssh/ec2.pem ubuntu@${{ secrets.EC2_HOST }} '
            set -e
            cd /home/ubuntu/app
            npm install
            pm2 describe sts-somalia-api > /dev/null 2>&1 \
              && pm2 restart sts-somalia-api \
              || pm2 start apps/api/dist/main.js --name sts-somalia-api --cwd /home/ubuntu/app/apps/api
            pm2 save
          '

  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          npm run build -w api
          npm run build -w web

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts

      - name: Ship build artifacts
        run: |
          rsync -az -e "ssh -i ~/.ssh/lightsail.pem" \
            apps/web/.next/standalone/ ubuntu@${{ secrets.LIGHTSAIL_HOST }}:/home/ubuntu/app/
          rsync -az -e "ssh -i ~/.ssh/lightsail.pem" \
            apps/web/.next/static/ ubuntu@${{ secrets.LIGHTSAIL_HOST }}:/home/ubuntu/app/apps/web/.next/static/
          rsync -az -e "ssh -i ~/.ssh/lightsail.pem" \
            apps/web/public/ ubuntu@${{ secrets.LIGHTSAIL_HOST }}:/home/ubuntu/app/apps/web/public/

      - name: Write env file
        run: |
          ssh -i ~/.ssh/lightsail.pem ubuntu@${{ secrets.LIGHTSAIL_HOST }} "cat > /home/ubuntu/app/apps/web/.env.local" <<EOF
          PORT=3000
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          DEMO_LOGIN_ENABLED=true
          EMAIL_PROVIDER=${{ vars.EMAIL_PROVIDER }}
          EMAIL_FROM=${{ vars.EMAIL_FROM }}
          EMAIL_REPLY_TO=${{ vars.EMAIL_REPLY_TO }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          INTEGRATIONS_ENCRYPTION_KEY=${{ secrets.INTEGRATIONS_ENCRYPTION_KEY }}
          EOF

      - name: Restart
        run: |
          ssh -i ~/.ssh/lightsail.pem ubuntu@${{ secrets.LIGHTSAIL_HOST }} '
            pm2 describe sts-somalia-web > /dev/null 2>&1 \
              && pm2 restart sts-somalia-web \
              || PORT=3000 HOSTNAME=0.0.0.0 pm2 start server.js --name sts-somalia-web --cwd /home/ubuntu/app/apps/web
            pm2 save
          '
