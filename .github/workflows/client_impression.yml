name: client_impression

# Vercel's existing Git integration builds this branch. This workflow tracks
# that deployment without a second build, a Vercel token, or a QA/prod release.
on:
  push:
    branches: [feat/reference-ui-vercel]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: client-impression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vercel_preview:
    name: Vercel client preview
    if: github.ref == 'refs/heads/feat/reference-ui-vercel'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify Vercel preview and publish link
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deadline = Date.now() + 15 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo, sha: context.sha, environment: 'Preview', per_page: 20,
              });
              const deployment = deployments[0];
              if (deployment) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: deployment.id, per_page: 1,
                });
                const status = statuses[0];
                if (status?.state === 'success') {
                  const url = new URL(status.environment_url);
                  if (url.protocol !== 'https:' || !url.hostname.endsWith('.vercel.app')) {
                    throw new Error('Vercel did not return a valid preview URL.');
                  }
                  url.pathname = '/design-preview';
                  url.search = '';
                  url.hash = '';
                  core.setOutput('preview_url', url.href);
                  await core.summary
                    .addHeading('Client impression')
                    .addLink('Open the Vercel UI preview', url.href)
                    .addRaw('\n\nQA and production are unchanged.\n')
                    .write();
                  return;
                }
                if (['failure', 'error', 'inactive'].includes(status?.state)) {
                  throw new Error(`Vercel preview deployment ended with ${status.state}.`);
                }
              }
              core.info('Waiting for the existing Vercel preview deployment...');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('No successful Vercel preview deployment found within 15 minutes.');
